manifest:
  self:
    import: submanifests

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: nfed
      url-base:  https://github.com/circuitdojo

  projects:
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: 3ce0b693bf73d6072a31918f45c8d1d3fa438854
      import:
        name-allowlist:
          - cjson
          - cmsis_6
          - cmock
          - hal_nordic
          - libmodem
          - mbedtls
          - mcuboot
          - memfault-firmware-sdk
          - nrfxlib
          - oberon-psa-crypto
          - segger
          - trusted-firmware-m
          - zcbor
          - zephyr
    - name: nfed
      remote: nfed
      repo-path: nrf9160-feather-examples-and-drivers
      revision: v3.4.x
